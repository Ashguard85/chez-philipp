services:

  chez-philipp-app:
    build:
      context: https://github.com/DEIN-USER/chez-philipp.git#main
      dockerfile: docker/app.Dockerfile
    container_name: chez-philipp-app
    ports:
      - "3200:80"
    environment:
      - CALDAV_USER=philipp
      - CALDAV_PASS=geheim123
      - ADMIN_PIN=1234
    restart: unless-stopped

  chez-philipp-api:
    build:
      context: https://github.com/DEIN-USER/chez-philipp.git#main
      dockerfile: api/Dockerfile
    container_name: chez-philipp-api
    expose:
      - "3201"
    volumes:
      - chez-philipp-api-data:/data
    environment:
      - PORT=3201
      - ADMIN_PIN=1234
      - DATA_DIR=/data
    restart: unless-stopped

  chez-philipp-cal:
    image: tomsquest/docker-radicale:latest
    container_name: chez-philipp-cal
    expose:
      - "5232"
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    environment:
      - RADICALE_CONFIG=/config/radicale.conf
    restart: unless-stopped

  chez-philipp-setup:
    build:
      context: https://github.com/DEIN-USER/chez-philipp.git#main
      dockerfile: docker/setup.Dockerfile
    container_name: chez-philipp-setup
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    environment:
      - CALDAV_USER=philipp
      - CALDAV_PASS=geheim123
    restart: "no"

volumes:
  chez-philipp-api-data:
  chez-philipp-cal-data:
  chez-philipp-cal-config:
