services:

  chez-philipp-app:
    build:
      context: https://github.com/Ashguard85/chez-philipp.git#main:chez-philipp
      dockerfile: frontend/app.Dockerfile
      args:
        CALDAV_USER: philipp
        CALDAV_PASS: geheim123
        ADMIN_PIN: "1234"
    container_name: chez-philipp-app
    ports:
      - "3200:80"
    restart: unless-stopped

  chez-philipp-api:
    build:
      context: https://github.com/Ashguard85/chez-philipp.git#main:chez-philipp
      dockerfile: api/Dockerfile
    container_name: chez-philipp-api
    ports:
      - "3201:3201"
    volumes:
      - chez-philipp-api-data:/data
    environment:
      - PORT=3201
      - ADMIN_PIN=1234
      - DATA_DIR=/data
    restart: unless-stopped

  chez-philipp-cal:
    image: tomsquest/docker-radicale:latest
    container_name: chez-philipp-cal
    ports:
      - "5232:5232"
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    environment:
      - RADICALE_CONFIG=/config/radicale.conf
    restart: unless-stopped

  chez-philipp-setup:
    build:
      context: https://github.com/Ashguard85/chez-philipp.git#main:chez-philipp
      dockerfile: scripts/setup.Dockerfile
    container_name: chez-philipp-setup
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    environment:
      - CALDAV_USER=philipp
      - CALDAV_PASS=geheim123
    restart: "no"

volumes:
  chez-philipp-api-data:
  chez-philipp-cal-data:
  chez-philipp-cal-config:
