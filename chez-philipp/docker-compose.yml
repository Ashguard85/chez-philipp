services:

  chez-philipp-app:
    image: nginx:alpine
    container_name: chez-philipp-app
    ports:
      - "3200:80"
    volumes:
      - chez-philipp-html:/usr/share/nginx/html
      - chez-philipp-nginx:/etc/nginx/conf.d
    environment:
      GITHUB_RAW: https://raw.githubusercontent.com/DEIN-USER/chez-philipp/main
      CALDAV_HOST: chez-philipp-cal
      CALDAV_PORT: "5232"
      CALDAV_USER: philipp
      CALDAV_PASS: geheim123
    entrypoint: >
      sh -c "apk add --no-cache curl &&
      curl -fsSL $${GITHUB_RAW}/scripts/start-app.sh -o /start.sh &&
      chmod +x /start.sh && /start.sh"
    restart: unless-stopped
    depends_on:
      chez-philipp-setup:
        condition: service_completed_successfully

  chez-philipp-cal:
    image: tomsquest/docker-radicale:latest
    container_name: chez-philipp-cal
    ports:
      - "5232:5232"
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    environment:
      RADICALE_CONFIG: /config/radicale.conf
    restart: unless-stopped
    depends_on:
      chez-philipp-setup:
        condition: service_completed_successfully

  chez-philipp-setup:
    image: alpine:latest
    container_name: chez-philipp-setup
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    environment:
      GITHUB_RAW: https://raw.githubusercontent.com/DEIN-USER/chez-philipp/main
      CALDAV_USER: philipp
      CALDAV_PASS: geheim123
    entrypoint: >
      sh -c "apk add --no-cache curl &&
      curl -fsSL $${GITHUB_RAW}/scripts/setup-cal.sh -o /setup.sh &&
      chmod +x /setup.sh && /setup.sh"
    restart: "no"

volumes:
  chez-philipp-html:
  chez-philipp-nginx:
  chez-philipp-cal-data:
  chez-philipp-cal-config:
