version: '3.8'

services:

  chez-philipp-app:
    image: nginx:alpine
    container_name: chez-philipp-app
    ports:
      - "3200:80"
    environment:
      - CALDAV_HOST=chez-philipp-cal
      - CALDAV_PORT=5232
      - CALDAV_USER=philipp
      - CALDAV_PASS=geheim123
      - GITHUB_RAW=https://raw.githubusercontent.com/DEIN-USER/chez-philipp/main
    command: >
      sh -c "
        apk add --no-cache curl &&
        curl -fsSL $$GITHUB_RAW/frontend/index.html |
          sed \"s|const CALDAV_URL = .*|const CALDAV_URL = 'http://$$CALDAV_HOST:$$CALDAV_PORT/$$CALDAV_USER/calendar/';|\" |
          sed \"s|const CALDAV_USER = .*|const CALDAV_USER = '$$CALDAV_USER';|\" |
          sed \"s|const CALDAV_PASS = .*|const CALDAV_PASS = '$$CALDAV_PASS';|\" \
          > /usr/share/nginx/html/index.html &&
        curl -fsSL $$GITHUB_RAW/nginx.conf > /etc/nginx/conf.d/default.conf &&
        nginx -g 'daemon off;'
      "
    restart: unless-stopped
    depends_on:
      - chez-philipp-cal

  chez-philipp-cal:
    image: tomsquest/docker-radicale:latest
    container_name: chez-philipp-cal
    ports:
      - "5232:5232"
    environment:
      - RADICALE_CONFIG=/config/radicale.conf
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    restart: unless-stopped

  chez-philipp-setup:
    image: alpine:latest
    container_name: chez-philipp-setup
    environment:
      - CALDAV_USER=philipp
      - CALDAV_PASS=geheim123
    volumes:
      - chez-philipp-cal-data:/data
      - chez-philipp-cal-config:/config
    command: >
      sh -c "
        apk add --no-cache python3 py3-pip &&
        pip install bcrypt --quiet &&
        if [ ! -f /data/users ]; then
          python3 -c \"
import bcrypt, os
user = os.environ['CALDAV_USER']
pw   = os.environ['CALDAV_PASS']
h    = bcrypt.hashpw(pw.encode(), bcrypt.gensalt()).decode()
open('/data/users','w').write(f'{user}:{h}\n')
print('User created:', user)
\"
        fi &&
        mkdir -p /data/collections/collection-root/$$CALDAV_USER/calendar &&
        if [ ! -f /data/collections/collection-root/$$CALDAV_USER/calendar/.Radicale.props ]; then
          echo '{\"D:displayname\": \"Chez Philipp\", \"tag\": \"VCALENDAR\"}' > /data/collections/collection-root/$$CALDAV_USER/calendar/.Radicale.props &&
          echo '{\"D:displayname\": \"$$CALDAV_USER\"}' > /data/collections/collection-root/$$CALDAV_USER/.Radicale.props
        fi &&
        cat > /config/radicale.conf << 'CONF'
[server]
hosts = 0.0.0.0:5232

[auth]
type = htpasswd
htpasswd_filename = /data/users
htpasswd_encryption = bcrypt

[storage]
filesystem_folder = /data/collections

[logging]
level = info

[headers]
Access-Control-Allow-Origin = *
Access-Control-Allow-Methods = GET, POST, PUT, DELETE, OPTIONS, PROPFIND, PROPPATCH, REPORT, MKCALENDAR, MKCOL
Access-Control-Allow-Headers = Authorization, Content-Type, Depth, If-Match, If-None-Match, Lock-Token, Overwrite, Prefer, Destination, X-Client
Access-Control-Expose-Headers = ETag, DAV
Access-Control-Allow-Credentials = true
CONF
        echo 'Setup complete!'
      "
    restart: "no"

volumes:
  chez-philipp-cal-data:
  chez-philipp-cal-config:
